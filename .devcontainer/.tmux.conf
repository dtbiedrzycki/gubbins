# Without this, tmux's default TERM reporting can cause the same
# garbled-character symptom as a missing locale, via a different
# mechanism: the app inside tmux gets incorrect terminal capabilities
# and mishandles cursor/escape sequences rather than just seeing wrong
# colors. tmux-256color is the correct report for a modern host
# terminal; screen-256color is the safe fallback for older ones.
set -g default-terminal "tmux-256color"

# Colour: tmux only forwards 24-bit ("truecolor") sequences, and only
# advertises them to apps running inside it, when told the outer terminal
# can handle them. The glob here is "*", not "*256col*": the host
# terminal in this container reports a bare "xterm" TERM, so any pattern
# assuming a "256color" suffix never matches and silently does nothing.
# terminal-features is the modern form (tmux >= 3.2); terminal-overrides
# with :Tc is kept for the escape-sequence path and older parsing.
# COLORTERM=truecolor (Dockerfile.dev) is the other half — apps that key
# off the env var rather than terminfo need it, and tmux does not forward
# it from the outer environment.
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# Mouse: wheel scrolls history / enters copy-mode, click focuses a pane
# or selects a window, drag resizes a split. Trade-off: mouse text
# selection now goes through tmux copy-mode instead of the terminal's
# native selection -- hold Shift while dragging for native select/copy.
set -g mouse on
