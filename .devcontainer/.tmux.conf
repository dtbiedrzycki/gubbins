# Without this, tmux's default TERM reporting can cause the same
# garbled-character symptom as a missing locale, via a different
# mechanism: the app inside tmux gets incorrect terminal capabilities
# and mishandles cursor/escape sequences rather than just seeing wrong
# colors. tmux-256color is the correct report for a modern host
# terminal; screen-256color is the safe fallback for older ones.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
