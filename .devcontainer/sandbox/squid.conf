# ADR-068 egress-proxy: hostname-based allowlist, not IP-based — never
# resolves a domain to decide allow/deny, so DNS rotation and CDN IP
# churn need no maintenance here.
#
# This is not an exclusion list. The project's own repository is on
# GitHub, which the entries below have to admit anyway, and a hostname
# allowlist sees hostnames rather than repositories. An `auto`-mode
# session is still expected to work locally and have a human push, but
# what the agent can do at the remote is bounded by the credentials in
# the container (ADR-069), not by this file.

http_port 3128

# --- npm ---
acl allowed_dst dstdomain registry.npmjs.org

# --- GitHub: web/API, git-over-https clone/fetch, tarball/release CDN ---
acl allowed_dst dstdomain github.com
acl allowed_dst dstdomain api.github.com
acl allowed_dst dstdomain codeload.github.com
acl allowed_dst dstdomain objects.githubusercontent.com
acl allowed_dst dstdomain raw.githubusercontent.com

# --- Anthropic API ---
acl allowed_dst dstdomain api.anthropic.com

# --- Anthropic account authentication (`claude login`) ---
# Widens the "Anthropic API" scope from ADR-068's original allowlist to
# include account auth infrastructure — a deliberate, recorded decision,
# not an incidental expansion (see changeset). platform.claude.com
# carries OAuth token exchange/refresh/revocation for both Console and
# claude.ai accounts; claude.com/claude.ai are the sign-in redirect hop
# the browser-based flow bounces through before landing back here.
acl allowed_dst dstdomain platform.claude.com
acl allowed_dst dstdomain claude.com
acl allowed_dst dstdomain claude.ai

# HTTPS arrives as CONNECT; only allow it to allowlisted hosts, and only
# on 443 — no tunneling arbitrary ports to an allowed domain.
acl connect_method method CONNECT
acl https_port port 443
http_access allow connect_method https_port allowed_dst
http_access deny connect_method

# Plain HTTP (rare in this allowlist, but handled the same way).
http_access allow allowed_dst

# Default deny — this is the line that matters most in this file.
http_access deny all

# This proxy exists to gate destinations, not to speed up repeat fetches.
cache deny all

# The entrypoint script (tail -F .../access.log &, etc.) is the image's
# actual mechanism for getting Squid's logs into `docker logs` — it
# tails real files and streams them to stdout on Squid's behalf.
# Pointing these directives at /dev/stdout directly instead fights that
# design and fails outright: Squid's file_open() does a real open() on
# the path, and the unprivileged `proxy` user Squid drops to internally
# can't reopen the container's stdout pipe that way, even though it
# already holds fd 1 pointed at it. (Confirmed via `squid -N -X -d9`:
# "error opening file /dev/stdout: (13) Permission denied" — this was
# also the true cause of the earlier *silent* exit 1, before cache_log
# was temporarily pointed at stdout for diagnosis; the FATAL message
# about failing to open access_log was itself being swallowed by
# cache_log's original /dev/null setting.)
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
