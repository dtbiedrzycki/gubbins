<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gubbins Guest Feedback Mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Fonts come from the repo's own Fontsource packages (run npm ci first); without them the Georgia and system-ui fallbacks show. */
@font-face { font-family: "IM Fell English"; font-style: normal; font-weight: 400; src: url(../../node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-style: normal; font-weight: 400; src: url(../../node_modules/@fontsource/alegreya-sans/files/alegreya-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-style: normal; font-weight: 700; src: url(../../node_modules/@fontsource/alegreya-sans/files/alegreya-sans-latin-700-normal.woff2) format("woff2"); }

:root {
  --page: #EEF0F3; --page-fg: #1C2230; --page-muted: #5B6474; --frame: #232833;
  --paper: #F6F3FB; --ink: #2E2447; --muted: #625A78; --line: #DCD3EA; --moss: #34603F; --petal: #F2CBD6; --gold: #D9A93A; --wax: #9E2A45;
  --f-display: "IM Fell English", Georgia, serif; --f-sans: "Alegreya Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #161A21; --page-fg: #E7EAF0; --page-muted: #9AA3B2; --frame: #05070A; color-scheme: dark } }
:root[data-theme="dark"] { --page: #161A21; --page-fg: #E7EAF0; --page-muted: #9AA3B2; --frame: #05070A; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font: 16px/1.5 system-ui, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }
.intro h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; }
.intro p { margin: 0 0 28px; color: var(--page-muted); max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 32px; align-items: start; }
figure { margin: 0; }
figcaption { margin: 0 0 10px; font-weight: 600; }
.phone { max-width: 390px; border: 10px solid var(--frame); border-radius: 32px; overflow: hidden; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #3B82F6; outline-offset: 2px; }

/* The Storybook guest view, as in apps/web/src/index.css. */
.s { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--f-sans); padding: 24px 20px 0; min-height: 720px; display: flex; flex-direction: column; gap: 20px; }
.s.dim { background: rgba(46,36,71,.5); padding: 16px; justify-content: center; }
.s a { color: var(--moss); }
.s h1, .s h2.d, .disp { font-family: var(--f-display); font-weight: 400; margin: 0; }
.s h1 { font-size: 2.05rem; line-height: 1.15; }
.s p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.vine { display: block; width: 70%; height: 18px; margin: 14px auto 0; background: radial-gradient(circle, var(--petal) 0 4px, var(--wax) 4px 5px, transparent 5.5px) center / 18px 18px no-repeat, linear-gradient(var(--moss), var(--moss)) center / 100% 1.5px no-repeat; }
.btn, .btn2 { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 22px 22px 22px 6px; font: 700 16px var(--f-sans); cursor: pointer; align-self: flex-start; }
.btn { background: var(--moss); color: #fff; }
.btn2 { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.link { background: none; border: 0; padding: 10px 0; color: var(--moss); text-decoration: underline; font: 700 15px var(--f-sans); cursor: pointer; align-self: flex-start; }
.field { display: block; width: 100%; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); font: 16px/1.45 var(--f-sans); }
label { display: block; margin-bottom: 4px; font-weight: 700; }
.card { border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seal { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; transform: rotate(-8deg); color: var(--petal); font: 1.35rem/1 var(--f-display); background: radial-gradient(circle at 38% 34%, #C2455F, var(--wax) 60%, #6E1830); }
.seal.gold { color: var(--ink); background: radial-gradient(circle at 38% 34%, #F3D27A, var(--gold) 60%, #A57E22); }
.seal.sm { width: 26px; height: 26px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 14px; border-radius: 22px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font: 700 15px var(--f-sans); cursor: pointer; }
.chip:has(.seal) { padding-left: 8px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { border-bottom: 1px solid var(--line); padding: 20px 0; display: flex; flex-direction: column; gap: 12px; }
.items h2 { font: 400 1.3rem/1.2 var(--f-display); margin: 0; }
.status { display: flex; align-items: center; gap: 10px; }
.jar { position: relative; flex: none; width: 46px; height: 58px; overflow: hidden; border: 2.5px solid var(--ink); border-radius: 10px 10px 14px 14px; background: #fff; }
.jar i { position: absolute; inset: auto 0 0 0; height: 60%; background: radial-gradient(circle at 30% 40%, #F3D27A 0 3px, transparent 3.5px) 0 0 / 10px 9px, var(--gold); }
.door { position: relative; width: 150px; height: 172px; margin: 0 auto; border-radius: 75px 75px 6px 6px; background: repeating-linear-gradient(90deg, var(--moss) 0 28px, #2B5035 28px 30px); box-shadow: 0 0 0 7px #8C6A4A, 0 0 0 9px var(--ink); }
.door::before { content: ""; position: absolute; left: 55px; top: 34px; width: 40px; height: 40px; border-radius: 50%; background: #F2E3A8; box-shadow: 0 0 0 4px #8C6A4A; }
.door::after { content: ""; position: absolute; right: 22px; top: 92px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); }
.dialog { border-radius: 22px; background: var(--paper); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.dot { flex: none; width: 10px; height: 10px; margin: 7px 9px 0; border-radius: 50%; background: var(--moss); }
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.points li { display: flex; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
footer.f { margin-top: auto; padding: 20px 0 28px; border-top: 1px solid var(--line); text-align: center; font-size: 14px; color: var(--muted); }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Guest feedback round: mockups</h1>
    <p>The screens this round changes, at phone width, in the Storybook look. The guest list is clickable: the filters work and descriptions expand. Example data only. Design: <code>docs/superpowers/specs/2026-10-26-guest-feedback-design.md</code>.</p>
  </div>
  <div class="grid">

    <figure>
      <figcaption>Guest list: how holding works, filters, descriptions, footer</figcaption>
      <div class="phone"><div class="s">
        <header class="center"><h1>Maya’s birthday</h1><span class="vine" aria-hidden="true"></span></header>
        <section aria-label="About this list" style="display:flex;flex-direction:column">
          <div class="clamp" data-desc>
            <p>Thank you for celebrating with me! Small things are just as lovely as big ones.</p>
            <p><strong>Shipping:</strong> Maya Lin, 12 Elm Street, Apt 4, Springfield, IL 62701</p>
            <p>Registry ideas I liked: <a href="https://example.com/ideas">https://example.com/ideas</a></p>
          </div>
          <button type="button" class="link" aria-expanded="false" data-toggle>Show more</button>
        </section>
        <details open class="card">
          <summary class="disp" style="font-size:20px;cursor:pointer">How holding a gift works</summary>
          <ol class="steps">
            <li><strong>Hold it before you buy it.</strong> Other guests see it’s taken, so nobody buys it twice.</li>
            <li><strong>Buy it within 3 days.</strong> The hold is yours until then, and you can extend it once.</li>
            <li><strong>Come back and mark it purchased.</strong> If you don’t, the hold ends after 3 days and another guest can buy the same gift.</li>
          </ol>
        </details>
        <div role="group" aria-label="Show gifts" class="chips">
          <button type="button" class="chip" aria-pressed="true" data-filter="all">All · 4</button>
          <button type="button" class="chip" aria-pressed="false" data-filter="available">Available · 2</button>
          <button type="button" class="chip" aria-pressed="false" data-filter="held"><span class="seal sm" aria-hidden="true">G</span>Held · 1</button>
          <button type="button" class="chip" aria-pressed="false" data-filter="purchased"><span class="seal sm gold" aria-hidden="true">G</span>Purchased or funded · 1</button>
        </div>
        <ul role="list" class="items">
          <li data-status="available">
            <h2>LEGO Botanical Bonsai Tree</h2><p><strong>$49.99</strong></p>
            <div style="display:flex;flex-direction:column"><p class="clamp" data-desc>The cherry-blossom version please, not the green one. Set number 10281. Any store is fine; I like supporting the little toy shop on Main Street if you happen to be nearby.</p><button type="button" class="link" aria-expanded="false" data-toggle>Show more</button></div>
            <button type="button" class="btn">Hold this item</button>
          </li>
          <li data-status="held">
            <h2>Cast iron skillet, 10 inch</h2><p><strong>$34.00</strong></p>
            <p>Pre-seasoned is great. No enamel coating.</p>
            <div class="status"><span class="seal" aria-hidden="true">G</span><p>Cast iron skillet, 10 inch is held.</p></div>
          </li>
          <li data-status="available">
            <h2>Espresso machine</h2><p><strong>$400.00</strong></p>
            <div style="display:flex;flex-direction:column"><p class="clamp" data-desc>A group gift: chip in any amount. I have my eye on the Breville Bambino in black, and any leftover goes to beans.</p><button type="button" class="link" aria-expanded="false" data-toggle>Show more</button></div>
            <div style="display:flex;align-items:flex-end;gap:14px"><div class="jar" aria-hidden="true"><i></i></div><p>$240.00 of $400.00 pledged · 60%</p></div>
            <button type="button" class="btn">Chip in</button>
          </li>
          <li data-status="purchased">
            <h2>Hiking boots, size 8</h2><p><strong>$129.00</strong></p>
            <p>Waterproof, mid-height. Brown or grey.</p>
            <div class="status"><span class="seal gold" aria-hidden="true">G</span><p>Hiking boots, size 8 has been purchased.</p></div>
          </li>
        </ul>
        <footer class="f">Gubbins is free software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a> · <a href="https://github.com/dtbiedrzycki/gubbins">Source on GitHub</a> · <a href="#privacy">Privacy</a></footer>
      </div></div>
    </figure>

    <figure>
      <figcaption>Key screen: where you are</figcaption>
      <div class="phone"><div class="s center" style="padding-top:40px">
        <div class="door" aria-hidden="true"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h1>Knock, knock.</h1>
          <p>You’ve found a <strong>gift list</strong> someone shared with you. It runs on Gubbins, a small wishlist app with no accounts, no ads and no tracking.</p>
          <p class="muted">Enter the guest key from your invite to see what they’re hoping for.</p>
        </div>
        <form style="display:flex;flex-direction:column;gap:14px;text-align:left" onsubmit="return false">
          <div>
            <label for="k">Guest key</label>
            <input id="k" class="field" placeholder="maple-lantern-otter" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="k-hint">
            <p id="k-hint" class="small muted" style="margin-top:6px">The list owner sent it with your invite: three words joined by dashes.</p>
          </div>
          <button type="submit" class="btn" style="align-self:stretch">View list</button>
        </form>
        <footer class="f">Gubbins is free software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a> · <a href="https://github.com/dtbiedrzycki/gubbins">Source on GitHub</a> · <a href="#privacy">Privacy</a></footer>
      </div></div>
    </figure>

    <figure>
      <figcaption>Hold dialog: mark it purchased</figcaption>
      <div class="phone"><div class="s dim">
        <div class="dialog" role="dialog" aria-labelledby="ht">
          <p id="ht" class="disp" style="font-size:1.3rem;line-height:1.2">Hold “LEGO Botanical Bonsai Tree” for yourself?</p>
          <p class="muted">Other guests will see it’s taken while you buy it.</p>
          <div class="card"><p><strong>After you buy it, come back and tap “Mark as purchased”.</strong></p><p>If you don’t, the hold ends after 3 days and another guest could buy it too.</p></div>
          <div><label for="hn" style="font-weight:400">Your name</label><input id="hn" class="field" value="Sam"><p class="small muted" style="margin-top:4px">Your name is only shared with the list owner.</p></div>
          <div><label for="hm" style="font-weight:400">Message to the owner (optional)</label><textarea id="hm" class="field" rows="2"></textarea></div>
          <div style="display:flex;gap:8px"><button type="button" class="btn">Yes, hold it</button><button type="button" class="btn2">Cancel</button></div>
        </div>
      </div></div>
    </figure>

    <figure>
      <figcaption>Chip in: paying with Zelle</figcaption>
      <div class="phone"><div class="s dim">
        <div class="dialog" role="dialog" aria-labelledby="zt">
          <p id="zt" class="disp" style="font-size:1.3rem;line-height:1.2">Chip in toward “Espresso machine”</p>
          <a href="#venmo" class="btn" style="text-decoration:none;text-align:center;color:#fff">Pay $25.00 with Venmo</a>
          <section class="card" aria-labelledby="zh">
            <h2 id="zh" style="margin:0;font-size:17px">Or pay with Zelle</h2>
            <ol class="steps">
              <li>Open your bank’s app and choose <strong>Send money with Zelle</strong>.</li>
              <li>Send <strong>$25.00</strong> to the handle below.</li>
              <li>Add “Espresso machine” as the memo.</li>
            </ol>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong>maya.lin@example.com</strong><button type="button" class="btn2">Copy</button></div>
          </section>
          <div style="display:flex;gap:8px"><button type="button" class="btn">I’ve sent it</button><button type="button" class="btn2">Cancel</button></div>
        </div>
      </div></div>
    </figure>

    <figure>
      <figcaption>Home page</figcaption>
      <div class="phone"><div class="s" style="padding-top:48px">
        <header class="center"><h1 style="font-size:2.75rem">Gubbins</h1><p style="margin-top:10px;font-size:18px">A wishlist that respects the people using it.</p><span class="vine" aria-hidden="true"></span></header>
        <p>Share a list of gifts you’d love. Guests hold what they’ll buy, so nobody doubles up, and can chip in together on bigger gifts.</p>
        <ul role="list" class="points">
          <li><span class="dot" aria-hidden="true"></span><span><strong>No tracking.</strong> No accounts, no profiles, and nothing that follows you around the web.</span></li>
          <li><span class="dot" aria-hidden="true"></span><span><strong>No ads.</strong> Ever.</span></li>
          <li><span class="dot" aria-hidden="true"></span><span><strong>Self-hostable.</strong> Runs on a Raspberry Pi.</span></li>
          <li><span class="dot" aria-hidden="true"></span><span><strong>Open source</strong> under the <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL v3</a>.</span></li>
        </ul>
        <p class="muted">Got an invite? Open the link from it.</p>
        <footer class="f">Gubbins is free software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a> · <a href="https://github.com/dtbiedrzycki/gubbins">Source on GitHub</a> · <a href="#privacy">Privacy</a></footer>
      </div></div>
    </figure>

    <figure>
      <figcaption>Owner: list description and the word key</figcaption>
      <div class="phone"><div class="s">
        <p class="eyebrow">Creating a list</p>
        <div><label for="lt">List name</label><input id="lt" class="field" value="Maya’s birthday"></div>
        <div>
          <label for="ld">About this list (optional)</label>
          <textarea id="ld" class="field" rows="5">Thank you for celebrating with me!

**Shipping:** Maya Lin, 12 Elm Street, Apt 4, Springfield, IL 62701</textarea>
          <p class="small muted" style="margin-top:6px">Guests see this above your list. If you want gifts mailed, add your shipping address here. Supports **bold**, *italics*, lists and links. You can’t change it after the list is created.</p>
        </div>
        <hr style="width:100%;border:0;border-top:1px solid var(--line);margin:4px 0">
        <p class="eyebrow">After creating it</p>
        <h1 style="font-size:1.75rem">Your list is ready.</h1>
        <div class="card"><p>Guest key: share it with your invite.</p><p style="font-size:24px;font-weight:700">maple-lantern-otter</p></div>
      </div></div>
    </figure>

  </div>
</div>
<script>
document.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => {
  const desc = button.parentElement.querySelector('[data-desc]');
  const open = desc.classList.toggle('clamp') === false;
  button.setAttribute('aria-expanded', String(open));
  button.textContent = open ? 'Show less' : 'Show more';
}));
document.querySelectorAll('[data-filter]').forEach((chip) => chip.addEventListener('click', () => {
  document.querySelectorAll('[data-filter]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  document.querySelectorAll('.items li').forEach((li) => { li.hidden = chip.dataset.filter !== 'all' && li.dataset.status !== chip.dataset.filter; });
}));
</script>
</body>
</html>
